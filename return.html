{% extends "base.html" %}{% block content %}<h2>Return equipment</h2><div class="card shadow-sm"><div class="card-body"><form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Active loan</label><select class="form-select" name="borrow_id" required>{% for l in loans if l.loan_status|lower=='borrowed' %}<option value="{{ l.borrow_id }}">Loan #{{ l.borrow_id }} · Equipment #{{ l.equipment_id }} · Borrower #{{ l.borrower_id }} · Due {{ l.due_date }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Returned condition</label><select class="form-select" name="return_condition" required><option value="Good">Good</option><option value="Damaged">Damaged</option></select></div>
<div class="col-12"><label class="form-label">Remarks</label><textarea class="form-control" name="remarks" maxlength="255"></textarea></div><div class="col-12"><button class="btn btn-primary">Record return</button></div></form></div></div>{% endblock %}

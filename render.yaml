services:
  - type: web
    name: university-equipment-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: ORDS_BASE_URL
        sync: false
      - key: ORDS_BEARER_TOKEN
        sync: false
      - key: ORDS_USERNAME
        sync: false
      - key: ORDS_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
